// ===========================================================================
// 기록 층 — localStorage 진도 저장 (CLAUDE.md 5장 구조)
// ===========================================================================
const STORAGE_KEY = "dokudo_progress_v1";

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      return {
        finished: p.finished || {},
        taps: p.taps || {},
        wordTaps: p.wordTaps || {},
        kana: p.kana || { pages: {}, done: false },
        currentLevel: p.currentLevel || 1,
        lastSaved: p.lastSaved || null,
      };
    }
  } catch (e) { /* 손상된 기록이면 새로 시작 */ }
  return { finished: {}, taps: {}, wordTaps: {}, kana: { pages: {}, done: false }, currentLevel: 1, lastSaved: null };
}

function saveProgress() {
  progress.lastSaved = new Date().toISOString();
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) { /* 시크릿 모드 등 저장 불가 환경에서는 조용히 넘어감 */ }
}

function glossTokenCount(book) {
  let n = 0;
  for (const sentence of book.sentences) {
    for (const tok of sentence) if (tok.g) n++;
  }
  return n;
}

// 단어 탭을 기록: 책별 위치(keys)는 중복 없이, 단어별 횟수(wordTaps)는 누적
function recordTap(book, si, ti, tok) {
  if (!progress.taps[book.id]) {
    progress.taps[book.id] = { tapped: 0, glossTokens: glossTokenCount(book), keys: [] };
  }
  const rec = progress.taps[book.id];
  const key = si + "-" + ti;
  if (!rec.keys.includes(key)) {
    rec.keys.push(key);
    rec.tapped = rec.keys.length;
  }
  progress.wordTaps[tok.t] = (progress.wordTaps[tok.t] || 0) + 1;
  saveProgress();
}

// ===========================================================================
// 듣기 — 브라우저 내장 음성 (Web Speech API, ja-JP)
// ===========================================================================
function speak(text, rate) {
  if (!("speechSynthesis" in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ja-JP";
  u.rate = rate || 0.9;
  const voice = speechSynthesis.getVoices().find((v) => v.lang && v.lang.indexOf("ja") === 0);
  if (voice) u.voice = voice;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

    esc(KANA_BOOK.title) + "</button></div>";

  const spines = kanaSpine + BOOKS.map((book) => {
    const check = progress.finished[book.id] ? '<span class="spine-check">✓</span>' : "";
    const height = book.level === 1 ? 170 : 210;
    return (
      '<div class="spine-col">' + check +
      '<button class="spine mincho" lang="ja" data-id="' + esc(book.id) + '" ' +
      'style="background:' + esc(book.color) + ';height:' + height + 'px;">' +
      esc(book.title) + "</button></div>"
    );
  }).join("");

  app.innerHTML =
    '<div class="wrap shelf-page">' +
      '<p class="shelf-kicker mincho" lang="ja">多読</p>' +
      '<h1 class="shelf-title mincho">다독 서가</h1>' +
      '<p class="shelf-desc">문법 설명 없이, 이해되는 만큼만 읽어보세요. 책등 색이 레벨이에요.</p>' +
      '<div class="legend">' +
        '<span><i style="background:#8B5E34"></i>글자책 · 여기부터</span>' +
        '<span><i style="background:#6B7A5E"></i>레벨1 · 히라가나만</span>' +
        '<span><i style="background:#2B4570"></i>레벨2 · 기초 한자</span>' +
      '</div>' +
      '<div class="bookshelf">' +
        '<div class="spines">' + spines + '</div>' +
        '<div class="shelf-wood-top"></div>' +
        '<div class="shelf-wood-bottom"></div>' +
      '</div>' +
      '<p class="shelf-hint">책등을 탭해서 꺼내 읽어보세요</p>' +
      (progress.kana.done ? "" :
        '<p class="shelf-hint" style="color:#8B5E34">일본어가 처음이라면 갈색 글자책 「ひらがな」부터 펼쳐보세요</p>') +
      '<p class="shelf-note">읽은 기록은 이 기기의 브라우저에만 저장돼요</p>' +
    '</div>';

  app.querySelectorAll(".spine").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.id === "kana") renderKanaToc();
      else renderReader(btn.dataset.id);
    });
  });
}

function tokenHtml(tok, si, ti) {
  const inner = tok.r
    ? "<ruby>" + esc(tok.t) + "<rt>" + esc(tok.r) + "</rt></ruby>"
    : esc(tok.t);
  if (!tok.g) return '<span class="tok">' + inner + "</span>";
  return '<span class="tok tok-tap" data-si="' + si + '" data-ti="' + ti + '">' + inner + "</span>";
}

function renderReader(bookId) {
  currentBook = BOOKS.find((b) => b.id === bookId);
  activeTokEl = null;
  if (!currentBook) { renderShelf(); return; }

  const body = currentBook.sentences.map((sentence, si) =>
    '<p><button class="tts-btn" data-si="' + si + '" title="읽어주기">&#9654;</button>' +
    sentence.map((tok, ti) => tokenHtml(tok, si, ti)).join("") + "</p>"
  ).join("");

  const done = !!progress.finished[currentBook.id];

  app.innerHTML =
    '<div class="wrap reader-page">' +
      '<button class="back-btn" id="backBtn">&larr; 책장으로</button>' +
      '<p class="reader-level" style="color:' + esc(currentBook.color) + '">' + esc(currentBook.levelLabel) + '</p>' +
      '<h2 class="reader-title mincho" lang="ja">' + esc(currentBook.title) + '</h2>' +
      '<p class="reader-subtitle">' + esc(currentBook.subtitle) + '</p>' +
      '<div class="reader-text mincho" lang="ja">' + body + '</div>' +
      '<button class="finish-btn' + (done ? " done" : "") + '" id="finishBtn">' +
        (done ? "✓ 다 읽음" : "다 읽었어요") + '</button>' +
    '</div>' +
    '<div class="gloss-strip"><div class="wrap" id="glossContent">' +
      '<p class="placeholder">단어를 탭하면 뜻이 보여요</p>' +
    '</div></div>';

  document.getElementById("backBtn").addEventListener("click", renderShelf);
  document.getElementById("finishBtn").addEventListener("click", toggleFinished);
  app.querySelectorAll(".tok-tap").forEach((el) => {
    el.addEventListener("click", () => onTokenTap(el));
  });
  app.querySelectorAll(".tts-btn").forEach((el) => {
    el.addEventListener("click", () => {
      const sentence = currentBook.sentences[Number(el.dataset.si)];
      speak(sentence.map((t) => t.t).join(""), 0.85);
    });
  });
}

function onTokenTap(el) {
  const si = Number(el.dataset.si);
  const ti = Number(el.dataset.ti);
  const tok = currentBook.sentences[si][ti];

  if (activeTokEl) activeTokEl.classList.remove("active");
  el.classList.add("active");
  activeTokEl = el;

  const reading = tok.r ? ' <span class="gloss-dim">(' + esc(tok.r) + ")</span>" : "";
  document.getElementById("glossContent").innerHTML =
    '<p><span class="gloss-word mincho" lang="ja">' + esc(tok.t) + "</span>" + reading +
    ' <span class="gloss-dim">—</span> ' + esc(tok.g) + "</p>";

  recordTap(currentBook, si, ti, tok);
}

// ---------- 0단계: 히라가나 글자책 ----------
function renderKanaToc() {
  currentBook = null;
  activeTokEl = null;

  const items = KANA_BOOK.pages.map((page, i) => {
    const seen = page.id === "mix" ? progress.kana.done : !!progress.kana.pages[page.id];
    return (
      '<button class="toc-item" data-i="' + i + '">' +
        '<span class="mincho" lang="ja">' + esc(page.name) + "</span>" +
        (seen ? '<span class="toc-check">✓</span>' : "") +
      "</button>"
    );
  }).join("");

  app.innerHTML =
    '<div class="wrap reader-page">' +
      '<button class="back-btn" id="backBtn">&larr; 책장으로</button>' +
      '<p class="reader-level" style="color:' + KANA_BOOK.color + '">0단계 · 글자 떼기</p>' +
      '<h2 class="reader-title mincho" lang="ja">' + esc(KANA_BOOK.title) + '</h2>' +
      '<p class="reader-subtitle">' + esc(KANA_BOOK.subtitle) + '</p>' +
      '<p class="kana-desc">글자를 탭하면 소리가 나요. 시험도 점수도 없어요 — 하루 한두 줄씩, 편하게 만나면 됩니다. 한 줄이 끝나면 배운 글자로만 만든 단어를 바로 읽어봐요.</p>' +
      '<div class="toc">' + items + '</div>' +
    '</div>';

  document.getElementById("backBtn").addEventListener("click", renderShelf);
  app.querySelectorAll(".toc-item").forEach((btn) => {
    btn.addEventListener("click", () => renderKanaPage(Number(btn.dataset.i)));
  });
}

function renderKanaPage(pi) {
  const page = KANA_BOOK.pages[pi];
  activeTokEl = null;
  const isMix = page.id === "mix";

  const tiles = page.kana.map((pair, i) =>
    '<button class="kana-tile mincho" lang="ja" data-i="' + i + '">' + esc(pair[0]) + "</button>"
  ).join("");

  const words = page.words.map((pair, i) =>
    '<span class="tok tok-tap kana-word mincho" lang="ja" data-i="' + i + '">' + esc(pair[0]) + "</span>"
  ).join("");

  const seen = isMix ? progress.kana.done : !!progress.kana.pages[page.id];
  const checkLabel = isMix
    ? (seen ? "✓ 이제 읽을 수 있어요" : "이제 읽을 수 있어요")
    : (seen ? "✓ 다 봤어요" : "이 줄 다 봤어요");

  app.innerHTML =
    '<div class="wrap reader-page">' +
      '<button class="back-btn" id="backBtn">&larr; 목차로</button>' +
      '<p class="reader-level" style="color:' + KANA_BOOK.color + '">0단계 · ' + esc(KANA_BOOK.subtitle) + '</p>' +
      '<h2 class="reader-title mincho" lang="ja">' + esc(page.name) + '</h2>' +
      (page.note ? '<p class="kana-note">' + esc(page.note) + '</p>' : "") +
      (tiles ? '<div class="kana-grid">' + tiles + '</div>' : "") +
      (words ? '<p class="kana-words-label">읽어보기 — 배운 글자로만 만든 단어예요</p>' +
        '<div class="kana-words" lang="ja">' + words + '</div>' : "") +
      '<div>' +
        '<button class="finish-btn' + (seen ? " done" : "") + '" id="kanaCheckBtn">' + checkLabel + '</button>' +
      '</div>' +
      (isMix && seen ? '<p class="kana-note">준비 끝! 책장으로 돌아가서 초록색 그림책부터 읽으면 돼요.</p>' : "") +
      '<div class="page-nav">' +
        (pi > 0
          ? '<button class="nav-btn" id="prevBtn" lang="ja">&larr; ' + esc(KANA_BOOK.pages[pi - 1].name) + '</button>'
          : "<span></span>") +
        (pi < KANA_BOOK.pages.length - 1
          ? '<button class="nav-btn" id="nextBtn" lang="ja">' + esc(KANA_BOOK.pages[pi + 1].name) + ' &rarr;</button>'
          : "<span></span>") +
      '</div>' +
    '</div>' +
    '<div class="gloss-strip"><div class="wrap" id="glossContent">' +
      '<p class="placeholder">글자나 단어를 탭하면 소리가 나고 뜻이 보여요</p>' +
    '</div></div>';

  document.getElementById("backBtn").addEventListener("click", renderKanaToc);

  function showInStrip(jp, hint) {
    document.getElementById("glossContent").innerHTML =
      '<p><span class="gloss-word mincho" lang="ja">' + esc(jp) + '</span> <span class="gloss-dim">—</span> ' + esc(hint) + "</p>";
  }
  function activate(el) {
    if (activeTokEl) activeTokEl.classList.remove("active");
    el.classList.add("active");
    activeTokEl = el;
  }

  app.querySelectorAll(".kana-tile").forEach((el) => {
    el.addEventListener("click", () => {
      const pair = page.kana[Number(el.dataset.i)];
      activate(el);
      showInStrip(pair[0], pair[1]);
      speak(pair[0], 0.8);
    });
  });
  app.querySelectorAll(".kana-word").forEach((el) => {
    el.addEventListener("click", () => {
      const pair = page.words[Number(el.dataset.i)];
      activate(el);
      showInStrip(pair[0], pair[1]);
      speak(pair[0], 0.85);
    });
  });
  document.getElementById("kanaCheckBtn").addEventListener("click", () => {
    if (isMix) progress.kana.done = !progress.kana.done;
    else progress.kana.pages[page.id] = !progress.kana.pages[page.id];
    saveProgress();
    renderKanaPage(pi);
  });
  const prevBtn = document.getElementById("prevBtn");
  if (prevBtn) prevBtn.addEventListener("click", () => renderKanaPage(pi - 1));
  const nextBtn = document.getElementById("nextBtn");
  if (nextBtn) nextBtn.addEventListener("click", () => renderKanaPage(pi + 1));
}

function toggleFinished() {
  progress.finished[currentBook.id] = !progress.finished[currentBook.id];
  saveProgress();
  const done = !!progress.finished[currentBook.id];
  const btn = document.getElementById("finishBtn");
  btn.classList.toggle("done", done);
  btn.textContent = done ? "✓ 다 읽음" : "다 읽었어요";
}

renderShelf();
</script>
</body>
</html>
